<div class="form-container">

  <div class="form-card">

    <h1>
      {{ isEditMode ? '✏️ Editar Contacto' : '👤 Nuevo Contacto' }}
    </h1>

    <div class="form-group">

      <label>Nombre</label>

      <input
        type="text"
        [(ngModel)]="contact.name"
        name="name"
        placeholder="Ingrese el nombre">

    </div>

    <div class="form-group">

      <label>Área</label>

      <input
        type="text"
        [(ngModel)]="contact.area"
        name="area"
        placeholder="Ingrese el área">

    </div>

    <div class="form-group">

      <label>Notas</label>

      <textarea
        [(ngModel)]="contact.notes"
        name="notes"
        rows="6"
        placeholder="Información adicional del contacto">
      </textarea>

    </div>

    <div class="actions">

      <button
        class="btn-cancel"
        routerLink="/contacts">

        Cancelar

      </button>

      <button
        class="btn-save"
        (click)="saveContact()">

        💾 Guardar

      </button>

    </div>

  </div>

</div>
